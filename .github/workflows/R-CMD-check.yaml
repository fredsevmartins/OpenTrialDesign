name: R scientific verification
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Audit dependencies
        shell: Rscript {0}
        run: source("scripts/audit-dependencies.R")
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
      - name: Execute all scientific examples
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          source("scripts/run-examples.R")
      - name: Scientific reference experiments
        shell: Rscript {0}
        run: |
          source("scripts/scientific-reference.R")
          source("scripts/product-scientific-reference.R")
          source("scripts/stress-validation.R")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            validation/
            check/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: opentrialdesign:0.3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start local product
        run: |
          docker run -d --name otd-product --read-only --tmpfs /tmp:size=512m,mode=1777 -p 127.0.0.1:3838:3838 opentrialdesign:0.3.0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3838/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs otd-product
          exit 1
      - name: Installed package and PDF in clean container
        run: |
          docker exec -w /tmp otd-product Rscript -e 'p <- jsonlite::fromJSON("/opt/OpenTrialDesign/renv.lock",simplifyVector=FALSE)$Packages; i <- installed.packages(); stopifnot(all(vapply(p,function(x)x$Version,character(1)) == i[names(p),"Version"])); testthat::test_package("OpenTrialDesign"); OpenTrialDesign::render_report(OpenTrialDesign::sample_size(OpenTrialDesign::trial_spec()),"/tmp/report.pdf","pdf"); stopifnot(file.exists("/tmp/report.pdf"))'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser acceptance
        env:
          OTD_APP_URL: http://127.0.0.1:3838/
          OTD_TEST_PDF: '1'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/product-browser.py
          npm install --prefix /tmp/otd-a11y axe-core@4.10.3 --ignore-scripts --no-audit --no-fund
          AXE_CORE_PATH=/tmp/otd-a11y/node_modules/axe-core/axe.min.js python scripts/improvements-browser.py
      - name: Container diagnostics
        if: always()
        run: |
          docker logs otd-product || true
          docker inspect otd-product || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-container-and-browser
          path: validation/
