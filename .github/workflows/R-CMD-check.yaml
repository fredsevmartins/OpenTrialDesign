name: R scientific verification
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Audit dependencies
        shell: Rscript {0}
        run: source("scripts/audit-dependencies.R")
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
      - name: Execute all scientific examples
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          source("scripts/run-examples.R")
      - name: Scientific reference experiments
        shell: Rscript {0}
        run: source("scripts/scientific-reference.R")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            validation/
            check/
