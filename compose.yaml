services:
  opentrialdesign:
    build: .
    image: opentrialdesign:0.4.0
    ports:
      - "127.0.0.1:3838:3838"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
